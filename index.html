<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confeitaria Modelo</title>
    <style>
        /* Variáveis de Cores e Estilo - Tema Confeitaria */
        :root {
            --primary-color: #FF69B4; /* Hot Pink */
            --secondary-color: #FFB6C1; /* Light Pink */
            --accent-color: #FF1493; /* Deep Pink */
            --bg-color: #FFF0F5; /* Lavender Blush */
            --text-color: #4A4A4A;
            --desc-color: #7A7A7A; /* Cor mais suave para descrição */
            --card-bg: #FFFFFF;
            --border-radius: 25px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 80px; 
        }

        header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            text-align: center;
            padding: 2rem 1rem;
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            box-shadow: 0 4px 10px rgba(255, 105, 180, 0.3);
            position: relative;
        }

        header h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .btn-instagram {
            display: inline-flex;
            align-items: center;
            background-color: white;
            color: var(--accent-color);
            padding: 8px 16px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
            margin-top: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }

        .btn-instagram:active {
            transform: scale(0.95);
        }

        main {
            max-width: 800px;
            margin: 0 auto;
            padding: 1rem;
        }

        .category-title {
            color: var(--accent-color);
            font-size: 1.5rem;
            margin: 1.5rem 0 1rem;
            border-bottom: 2px dashed var(--secondary-color);
            padding-bottom: 5px;
        }

        .product-card {
            background-color: var(--card-bg);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(255, 182, 193, 0.2);
        }

        .product-info {
            flex: 1;
            padding-right: 15px;
        }

        .product-info h3 {
            font-size: 1.1rem;
            color: var(--text-color);
            margin-bottom: 4px;
        }

        .product-desc {
            font-size: 0.85rem;
            color: var(--desc-color);
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .price {
            color: var(--primary-color);
            font-weight: bold;
            font-size: 1.1rem;
        }

        .btn-add {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(255, 105, 180, 0.4);
            transition: background-color 0.2s, transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .btn-add:active {
            transform: scale(0.9);
            background-color: var(--accent-color);
        }

        /* Carrinho Flutuante */
        .floating-cart {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--accent-color);
            color: white;
            padding: 15px 30px;
            border-radius: 30px;
            box-shadow: 0 5px 15px rgba(255, 20, 147, 0.4);
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1rem;
            display: none;
            z-index: 100;
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        /* Modal do Carrinho */
        .cart-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: flex-end;
        }

        .cart-content {
            background-color: white;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            border-top-left-radius: var(--border-radius);
            border-top-right-radius: var(--border-radius);
            padding: 20px;
            overflow-y: auto;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 10px;
        }

        .close-cart {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--text-color);
            cursor: pointer;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding: 5px 0;
            border-bottom: 1px solid #eee;
        }

        .cart-total {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--accent-color);
            text-align: right;
            margin: 15px 0;
        }

        /* Formulário */
        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: var(--text-color);
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--secondary-color);
            border-radius: 15px;
            outline: none;
            font-size: 1rem;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: var(--primary-color);
        }

        .btn-checkout {
            width: 100%;
            background-color: #25D366; 
            color: white;
            border: none;
            padding: 15px;
            border-radius: 25px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(37, 211, 102, 0.3);
            margin-top: 10px;
        }

        .btn-checkout:active {
            transform: scale(0.98);
        }

        #endereco-group {
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>Confeitaria Modelo</h1>
        <p>Adoçando seus melhores momentos!</p>
        <a href="https://instagram.com/rktechcaruaru" target="_blank" class="btn-instagram">
            📷 @rktechcaruaru
        </a>
    </header>

    <main>
        <h2 class="category-title">Bolos Especiais</h2>
        <div id="bolos-container"></div>

        <h2 class="category-title">Centos de Brigadeiro Gourmet</h2>
        <div id="brigadeiros-container"></div>

        <h2 class="category-title">Tortas Salgadas</h2>
        <div id="tortas-container"></div>

        <h2 class="category-title">Centos de Salgadinhos</h2>
        <div id="salgados-container"></div>
    </main>

    <div class="floating-cart" id="floatingCart" onclick="toggleCart()">
        🛒 Ver Pedido (<span id="cart-count">0</span>) - R$ <span id="cart-total-float">0,00</span>
    </div>

    <div class="cart-modal" id="cartModal">
        <div class="cart-content">
            <div class="cart-header">
                <h2>Seu Pedido</h2>
                <button class="close-cart" onclick="toggleCart()">✖</button>
            </div>
            
            <div id="cart-items">
                </div>
            
            <div class="cart-total">
                Total: R$ <span id="cart-total-modal">0,00</span>
            </div>

            <hr style="border: 1px dashed var(--secondary-color); margin: 20px 0;">

            <h3>Finalizar Pedido</h3>
            <div class="form-group" style="margin-top: 15px;">
                <label>Nome Completo:</label>
                <input type="text" id="nome" placeholder="Digite seu nome">
            </div>
            <div class="form-group">
                <label>Telefone para Contato:</label>
                <input type="tel" id="telefone" placeholder="(81) 90000-0000">
            </div>
            <div class="form-group">
                <label>Método de Entrega:</label>
                <select id="metodo" onchange="toggleEndereco()">
                    <option value="retirada">Retirada na Loja</option>
                    <option value="entrega">Entrega no Endereço (Delivery)</option>
                </select>
            </div>
            <div class="form-group" id="endereco-group">
                <label>Endereço Completo:</label>
                <input type="text" id="endereco" placeholder="Rua, Número, Bairro, Ponto de Referência">
            </div>

            <button class="btn-checkout" onclick="enviarWhatsApp()">
                Finalizar no WhatsApp 📱
            </button>
        </div>
    </div>

    <script>
        // Dados do Cardápio com Descrições
        const cardapio = {
            bolos: [
                { id: 'b1', nome: 'Bolo de Chocolate Vulcão', descricao: 'Massa fofinha de cacau 50% coberta com uma generosa camada de brigadeiro cremoso e granulados.', preco: 45.00 },
                { id: 'b2', nome: 'Bolo Red Velvet', descricao: 'Tradicional massa aveludada vermelha com recheio e cobertura rica de cream cheese doce.', preco: 65.00 },
                { id: 'b3', nome: 'Bolo de Morango com Chantilly', descricao: 'Pão de ló super leve umedecido com calda, recheado com morangos frescos picados e chantilly.', preco: 55.00 }
            ],
            brigadeiros: [
                { id: 'br1', nome: 'Cento de Brigadeiro Tradicional', descricao: 'O clássico irresistível feito com leite condensado moça, cacau 50% e granulado macio.', preco: 120.00 },
                { id: 'br2', nome: 'Cento de Ninho com Nutella', descricao: 'A combinação perfeita: massa deliciosa de Leite Ninho recheada com a verdadeira Nutella.', preco: 150.00 },
                { id: 'br3', nome: 'Cento Misto (Até 2 Sabores)', descricao: 'Monte seu cento escolhendo dois sabores: Brigadeiro, Beijinho, Bicho de pé ou Casadinho.', preco: 130.00 }
            ],
            tortas: [
                { id: 't1', nome: 'Torta de Frango com Catupiry', descricao: 'Massa podre que derrete na boca, bem recheada com frango desfiado temperadinho e catupiry original.', preco: 50.00 },
                { id: 't2', nome: 'Torta Mista (Presunto e Queijo)', descricao: 'Clássica e deliciosa, feita com recheio cremoso de presunto magro, mussarela e um toque de orégano.', preco: 45.00 },
                { id: 't3', nome: 'Empadão de Camarão', descricao: 'Massa artesanal super macia com recheio abundante e cremoso de camarões refogados no azeite.', preco: 70.00 }
            ],
            salgados: [
                { id: 's1', nome: 'Cento de Coxinha', descricao: 'Massa de batata sequinha e crocante por fora, macia por dentro, com recheio suculento de frango.', preco: 40.00 },
                { id: 's2', nome: 'Cento de Bolinha de Queijo', descricao: 'Bolinhas fritas na hora, super recheadas com um mix delicioso de queijos derretidos.', preco: 40.00 },
                { id: 's3', nome: 'Cento Misto de Salgados', descricao: 'A opção ideal para sua festa: um mix equilibrado de coxinhas, bolinhas de queijo e kibes recheados.', preco: 45.00 }
            ]
        };

        let carrinho = [];

        // Função para renderizar os produtos na tela
        function renderizarCardapio() {
            const gerarHTML = (produto) => `
                <div class="product-card">
                    <div class="product-info">
                        <h3>${produto.nome}</h3>
                        <p class="product-desc">${produto.descricao}</p>
                        <p class="price">R$ ${produto.preco.toFixed(2).replace('.', ',')}</p>
                    </div>
                    <button class="btn-add" onclick="adicionarAoCarrinho('${produto.id}', '${produto.nome}', ${produto.preco})">+</button>
                </div>
            `;

            document.getElementById('bolos-container').innerHTML = cardapio.bolos.map(gerarHTML).join('');
            document.getElementById('brigadeiros-container').innerHTML = cardapio.brigadeiros.map(gerarHTML).join('');
            document.getElementById('tortas-container').innerHTML = cardapio.tortas.map(gerarHTML).join('');
            document.getElementById('salgados-container').innerHTML = cardapio.salgados.map(gerarHTML).join('');
        }

        // Funções do Carrinho
        function adicionarAoCarrinho(id, nome, preco) {
            const itemExistente = carrinho.find(item => item.id === id);
            if (itemExistente) {
                itemExistente.quantidade++;
            } else {
                carrinho.push({ id, nome, preco, quantidade: 1 });
            }
            atualizarCarrinho();
            
            const btnFloat = document.getElementById('floatingCart');
            btnFloat.style.transform = 'translateX(-50%) scale(1.05)';
            setTimeout(() => { btnFloat.style.transform = 'translateX(-50%) scale(1)'; }, 200);
        }

        function removerDoCarrinho(id) {
            carrinho = carrinho.filter(item => item.id !== id);
            atualizarCarrinho();
        }

        function atualizarCarrinho() {
            const btnFloat = document.getElementById('floatingCart');
            const qtdSpan = document.getElementById('cart-count');
            const totalFloat = document.getElementById('cart-total-float');
            const totalModal = document.getElementById('cart-total-modal');
            const cartItemsContainer = document.getElementById('cart-items');

            let total = 0;
            let qtdTotal = 0;
            
            cartItemsContainer.innerHTML = '';

            carrinho.forEach(item => {
                total += item.preco * item.quantidade;
                qtdTotal += item.quantidade;

                cartItemsContainer.innerHTML += `
                    <div class="cart-item">
                        <div>
                            <strong>${item.quantidade}x</strong> ${item.nome}
                        </div>
                        <div>
                            R$ ${(item.preco * item.quantidade).toFixed(2).replace('.', ',')}
                            <button onclick="removerDoCarrinho('${item.id}')" style="margin-left: 10px; color: red; background: none; border: none; font-weight: bold; cursor: pointer;">X</button>
                        </div>
                    </div>
                `;
            });

            const totalFormatado = total.toFixed(2).replace('.', ',');
            totalFloat.innerText = totalFormatado;
            totalModal.innerText = totalFormatado;
            qtdSpan.innerText = qtdTotal;

            if (carrinho.length > 0) {
                btnFloat.style.display = 'block';
            } else {
                btnFloat.style.display = 'none';
                cartItemsContainer.innerHTML = '<p style="text-align:center; color:#999;">Seu carrinho está vazio.</p>';
            }
        }

        // UI toggles
        function toggleCart() {
            const modal = document.getElementById('cartModal');
            if (modal.style.display === 'flex') {
                modal.style.display = 'none';
            } else {
                modal.style.display = 'flex';
            }
        }

        function toggleEndereco() {
            const metodo = document.getElementById('metodo').value;
            const enderecoGroup = document.getElementById('endereco-group');
            if (metodo === 'entrega') {
                enderecoGroup.style.display = 'block';
            } else {
                enderecoGroup.style.display = 'none';
            }
        }

        // Finalizar Pedido no WhatsApp
        function enviarWhatsApp() {
            if (carrinho.length === 0) {
                alert("Adicione itens ao carrinho primeiro!");
                return;
            }

            const nome = document.getElementById('nome').value.trim();
            const telefone = document.getElementById('telefone').value.trim();
            const metodo = document.getElementById('metodo').value;
            const endereco = document.getElementById('endereco').value.trim();

            if (!nome || !telefone) {
                alert("Por favor, preencha nome e telefone!");
                return;
            }

            if (metodo === 'entrega' && !endereco) {
                alert("Por favor, preencha seu endereço para entrega!");
                return;
            }

            let mensagem = `*Novo Pedido - Confeitaria Modelo* 🧁\n\n`;
            mensagem += `*Cliente:* ${nome}\n`;
            mensagem += `*Contato:* ${telefone}\n`;
            mensagem += `*Método:* ${metodo === 'entrega' ? '🛵 Entrega' : '🏪 Retirada na Loja'}\n`;
            
            if (metodo === 'entrega') {
                mensagem += `*Endereço:* ${endereco}\n`;
            }

            mensagem += `\n*RESUMO DO PEDIDO:*\n`;
            
            let total = 0;
            carrinho.forEach(item => {
                const subtotal = item.preco * item.quantidade;
                total += subtotal;
                mensagem += `▪️ ${item.quantidade}x ${item.nome} - R$ ${subtotal.toFixed(2).replace('.', ',')}\n`;
            });

            mensagem += `\n*TOTAL: R$ ${total.toFixed(2).replace('.', ',')}*\n`;

            const numeroWhatsApp = "5581921426179";
            const linkWhatsApp = `https://wa.me/${numeroWhatsApp}?text=${encodeURIComponent(mensagem)}`;

            window.open(linkWhatsApp, '_blank');
        }

        // Inicializar
        renderizarCardapio();
        atualizarCarrinho();
    </script>
</body>
</html>
